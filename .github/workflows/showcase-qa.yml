name: Showcase QA
on:
  push:
    branches: [feat/oss-showcase-20260916]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Freeze source
        run: |
          mkdir -p evidence
          git archive HEAD --format=tar.gz -o evidence/source.tar.gz
          git rev-parse HEAD > evidence/HEAD.txt
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Build GitHub Pages bundle
        run: npm run build 2>&1 | tee evidence/build.log
        env:
          GITHUB_PAGES: '1'
      - name: Archive runnable bundle
        run: tar -czf evidence/dist.tar.gz dist
      - name: Contract regression tests
        run: node scripts/test-contracts.mjs 2>&1 | tee evidence/contracts.log
      - name: Browser QA (when capture script is present)
        if: success() && hashFiles('scripts/browser-qa.mjs') != ''
        run: |
          npm install --prefix /tmp/orc-browser --no-audit --no-fund playwright@1.55.0
          /tmp/orc-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/orc-browser/node_modules/playwright/index.mjs node scripts/browser-qa.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-orc-qa-${{ github.sha }}
          path: evidence/
          retention-days: 30
