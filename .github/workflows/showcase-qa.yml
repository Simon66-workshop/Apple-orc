name: Showcase QA
on:
  push:
    branches: [feat/oss-showcase-20260916]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: showcase-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Freeze source
        run: |
          mkdir -p evidence
          git archive HEAD --format=tar.gz -o evidence/source.tar.gz
          git rev-parse HEAD > evidence/HEAD.txt
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Build GitHub Pages bundle
        run: npm run build 2>&1 | tee evidence/build.log
        env:
          GITHUB_PAGES: '1'
      - name: Archive runnable bundle
        run: tar -czf evidence/dist.tar.gz dist
      - name: Contract regression tests
        run: node scripts/test-contracts.mjs 2>&1 | tee evidence/contracts.log
      - name: Browser QA and four real screenshots
        run: |
          npm install --prefix /tmp/orc-browser --no-audit --no-fund playwright@1.55.0
          /tmp/orc-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/orc-browser/node_modules/playwright/index.mjs node scripts/browser-qa.mjs 2>&1 | tee evidence/browser.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-orc-qa-${{ github.sha }}
          path: evidence/
          retention-days: 30
  publish-screenshots:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/oss-showcase-20260916'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apple-orc-qa-${{ github.sha }}
          path: ${{ runner.temp }}/showcase-evidence
      - name: Publish generated assets without changing application branches
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          dest="$RUNNER_TEMP/showcase-assets"
          if git ls-remote --exit-code --heads origin showcase-assets > /dev/null; then
            git fetch origin showcase-assets
            git worktree add --detach "$dest" FETCH_HEAD
          else
            git worktree add --detach "$dest" HEAD
            (cd "$dest" && git checkout --orphan showcase-assets && git rm -rf .)
          fi
          mkdir -p "$dest/screenshots" "$dest/validation"
          cp "$RUNNER_TEMP/showcase-evidence/screenshots/"*.png "$dest/screenshots/"
          cp "$RUNNER_TEMP/showcase-evidence/"{browser.json,contracts.json,HEAD.txt} "$dest/validation/"
          printf '# Apple Orc — real browser captures\n\nSource commit: `%s`\n\nFour screenshots are generated by scripts/browser-qa.mjs from the production build. Renderer, dimensions and SHA-256 hashes are in validation/browser.json. These are interactive local component examples, not customer deployments or model API calls.\n' "$SOURCE_SHA" > "$dest/README.md"
          cd "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots validation README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture four live interfaces from $SOURCE_SHA"
            git push origin HEAD:refs/heads/showcase-assets
          fi
